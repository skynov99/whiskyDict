<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>싱글몰트 위스키 백과사전</title>
<style>
:root{
  --rust:#b9654b;   /* 단풍 러스트 */
  --amber:#c9a063;  /* 호박 앰버 */
  --moss:#8b9a6a;   /* 이끼 올리브 */
  --bg1:#150e0c;--bg2:#2a1a14;
  --text:#f1e6d8;--muted:#b9a794;
  --glass:rgba(255,240,220,.07);--glass-b:rgba(255,235,210,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.7}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none}
.o1{width:480px;height:480px;background:var(--rust);top:-120px;left:-100px}
.o2{width:420px;height:420px;background:var(--amber);bottom:-120px;right:-80px;opacity:.35}
.o3{width:360px;height:360px;background:var(--moss);top:45%;left:55%;opacity:.28}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:20px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header.hero{padding:44px 28px;text-align:center;margin-bottom:20px}
.hero h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(28px,6vw,48px);margin:0 0 8px;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--amber),var(--rust));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted)}
nav.bar{position:sticky;top:10px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px;margin-bottom:20px;align-items:center}
nav.bar button,.chip{font:inherit;color:var(--text);background:transparent;border:1px solid var(--glass-b);border-radius:999px;
  padding:6px 14px;cursor:pointer;transition:.2s}
nav.bar button:hover,.chip:hover{background:rgba(255,235,210,.1)}
nav.bar button.on{background:var(--rust);border-color:var(--rust);color:#fff}
nav.bar input{flex:1;min-width:140px;font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--glass-b);
  border-radius:999px;padding:7px 14px;outline:none}
nav.bar input:focus{border-color:var(--amber)}
section.sec{padding:26px;margin-bottom:22px}
section.sec h2{font-family:Georgia,"Noto Serif KR",serif;margin:0;font-size:26px;color:var(--amber)}
section.sec .sub{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.facts{margin:14px 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{padding:10px 14px;border-left:3px solid var(--moss);background:rgba(139,154,106,.1);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.card{padding:16px;border-radius:16px;background:rgba(255,240,220,.05);border:1px solid var(--glass-b);transition:.25s}
.card:hover{transform:translateY(-3px);border-color:var(--amber)}
.card h3{margin:0 0 2px;font-size:17px;color:var(--text)}
.card .meta{font-size:12px;color:var(--amber);margin-bottom:6px}
.card p{margin:0 0 8px;font-size:14px;color:#e2d4c2}
.tag{display:inline-block;font-size:11px;padding:2px 9px;margin:2px 4px 0 0;border-radius:999px;border:1px solid}
.t0{color:var(--rust);border-color:var(--rust)}.t1{color:var(--amber);border-color:var(--amber)}.t2{color:var(--moss);border-color:var(--moss)}
.src{margin-top:18px;padding-top:12px;border-top:1px dashed var(--glass-b);font-size:13px;color:var(--muted)}
.src a{color:var(--amber);text-underline-offset:3px}
.empty{color:var(--muted);padding:20px;text-align:center}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
@media(max-width:600px){section.sec{padding:18px}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">
  <header class="hero glass">
    <h1>싱글몰트 위스키 백과사전</h1>
    <p>Single Malt Scotch Whisky Encyclopedia · 지역 · 증류소 · 제조 · 용어 · 테이스팅</p>
  </header>
  <nav class="bar glass" id="nav"></nav>
  <main id="main"></main>
  <p class="note">이 백과사전은 외부 링크를 검증하지 못한 상태에서 작성되어 출처 링크를 싣지 않았습니다. 확실하지 않은 내용은 “(추정)”으로 표시했으니 중요한 정보는 증류소 공식 사이트 등에서 재확인하세요. 음주는 성인만, 적당히 즐기세요.</p>
</div>
<script>
const DATA = {"islay": {"title": "아일라", "subtitle": "Islay", "summary": "스코틀랜드 서쪽 헤브리디스 제도의 섬으로, 피트(이탄)와 바다 내음의 스모키한 위스키로 유명합니다. (외부 출처 대조 없이 작성, 연도는 추정 포함.)", "facts": ["강한 피트 스모크와 해풍·요오드 풍미의 대표 산지.", "모든 증류소가 강하게 피티드한 것은 아니며 Bruichladdich처럼 무피트 라인도 있습니다. (추정)"], "items": [{"name": "Ardbeg", "meta": "1815 (추정)", "detail": "강한 피트와 스모크, 감초·타르 같은 복합미.", "tags": ["피트", "스모키"]}, {"name": "Laphroaig", "meta": "1815 (추정)", "detail": "약품·요오드 느낌의 강렬한 피트 스타일로 호불호가 큼.", "tags": ["피트", "요오드"]}, {"name": "Lagavulin", "meta": "1816 (추정)", "detail": "진하고 둥근 스모크와 셰리의 단맛이 어우러진 스타일.", "tags": ["피트", "풍부함"]}, {"name": "Bowmore", "meta": "1779 (추정)", "detail": "아일라 중 오래된 증류소로 알려져 있으며 중간 강도의 피트와 열대과일 느낌.", "tags": ["피트", "과일"]}, {"name": "Caol Ila", "meta": "1846 (추정)", "detail": "깔끔하고 오일리한 스모크, 레몬 같은 산뜻함.", "tags": ["피트", "깔끔함"]}, {"name": "Bunnahabhain", "meta": "1881 (추정)", "detail": "아일라에서는 주로 무피트 또는 약피트 스타일. 견과와 해풍.", "tags": ["무피트", "견과"]}, {"name": "Bruichladdich", "meta": "1881 (추정)", "detail": "무피트 라인이 중심이며 피트 라인도 별도 생산.", "tags": ["보리", "다양성"]}, {"name": "Kilchoman", "meta": "2005 (추정)", "detail": "2000년대에 설립된 신생 농장형 증류소.", "tags": ["신생", "피트"]}], "sources": [], "key": "islay"}, "speyside": {"title": "스페이사이드", "subtitle": "Speyside", "summary": "스코틀랜드 북동부 스페이강 유역으로, 증류소가 가장 밀집한 지역입니다. 일반적으로 과일·꿀·바닐라 중심의 부드럽고 달콤한 스타일이 많습니다. (이 섹션은 외부 출처 대조 없이 작성되어 연도 일부는 추정입니다.)", "facts": ["스코틀랜드에서 증류소가 가장 많이 모여 있는 지역으로 알려져 있습니다.", "셰리 캐스크 숙성의 풍부한 스타일과 버번 캐스크의 가벼운 스타일이 공존합니다."], "items": [{"name": "Glenfiddich", "meta": "1887", "detail": "세계적으로 많이 팔리는 싱글몰트 브랜드 중 하나. 배 같은 과일향의 가벼운 스타일이 특징.", "tags": ["과일", "부드러움"]}, {"name": "The Macallan", "meta": "1824 면허 (추정)", "detail": "셰리 캐스크 숙성으로 유명. 건과일과 스파이스 중심의 묵직한 풍미.", "tags": ["셰리", "건과일"]}, {"name": "The Glenlivet", "meta": "1824 면허 (추정)", "detail": "스페이사이드 최초의 합법 증류 면허 중 하나로 알려져 있음. 꽃과 과일의 우아한 스타일.", "tags": ["꽃", "과일"]}, {"name": "The Balvenie", "meta": "1892 (추정)", "detail": "자체 몰팅 플로어를 운영하는 것으로 알려진 증류소. 꿀과 바닐라 풍미.", "tags": ["꿀", "바닐라"]}, {"name": "Aberlour", "meta": "1879 (추정)", "detail": "셰리 캐스크 비중이 높고 달콤한 과일과 견과 풍미.", "tags": ["셰리", "견과"]}, {"name": "Glenfarclas", "meta": "1836 (추정)", "detail": "가족 소유 증류소로 알려져 있으며 셰리 캐스크 숙성 위주.", "tags": ["셰리", "묵직함"]}], "sources": [], "key": "speyside"}, "islands": {"key": "islands", "title": "아일랜즈", "subtitle": "Islands", "summary": "아일랜즈는 스코틀랜드 본토 주변 섬(오크니, 스카이, 멀, 주라, 아란 등)에서 만든 싱글몰트를 가리키는 통칭이다. 스카치 위스키 규정상 공식 생산 지역(Highland, Lowland, Speyside, Islay, Campbeltown)에는 포함되지 않고 보통 하이랜드의 일부로 분류되며, 비공식 여섯 번째 지역으로 다루는 경우가 많다. 이슬레이(Islay)는 별도의 공식 지역이므로 보통 아일랜즈에서 제외한다. 섬마다 스타일 차이가 커서 하나의 일관된 풍미로 묶기 어렵다.", "facts": ["아일랜즈는 공식 지역이 아니며 규정상 대체로 하이랜드에 속하는 것으로 본다(추정, 출처 미확인).", "이슬레이는 별도의 공식 지역이라 일반적으로 아일랜즈에서 제외한다.", "대표 섬은 오크니, 스카이, 멀, 주라, 아란이다.", "섬 위스키는 해양성, 스모키, 부드러운 스타일이 공존해 단일한 풍미 정의가 어렵다.", "어떤 증류소를 아일랜즈에 넣을지는 자료마다 다르다(예: 루이스, 라세이 등을 포함하기도 함)."], "items": [{"name": "하이랜드 파크 (Highland Park)", "meta": "오크니 메인랜드 커크월 / 1798년(통상 인용, 추정)", "detail": "오크니의 대표 증류소로 스코틀랜드 최북단급 증류소 중 하나다. 이탄과 셰리 캐스크를 활용한 균형 잡힌 스타일로 알려져 있다.", "tags": ["오크니", "이탄", "셰리"]}, {"name": "스카파 (Scapa)", "meta": "오크니 메인랜드 커크월 / 1885년(통상 인용)", "detail": "오크니의 또 다른 증류소로 하이랜드 파크와 같은 섬에 있다. 비교적 부드럽고 과일 향이 있는 스타일로 알려져 있다(추정).", "tags": ["오크니", "부드러움"]}, {"name": "탈리스커 (Talisker)", "meta": "스카이섬 카보스트 / 1830년(통상 인용)", "detail": "스카이섬의 대표 증류소다. 후추 같은 스파이스와 해양성, 약한 스모크 풍미로 잘 알려져 있다.", "tags": ["스카이", "해양성", "스파이스"]}, {"name": "토버모리 (Tobermory)", "meta": "멀섬 토버모리 / 1798년(통상 인용)", "detail": "멀섬의 유일한 증류소로 알려져 있다. 비이탄 토버모리와 이탄을 쓴 레딕(Ledaig) 두 가지 몰트를 생산한다.", "tags": ["멀", "레딕", "이탄"]}, {"name": "주라 (Jura)", "meta": "주라섬 크레이그하우스 / 1810년 창립, 1963년 재건(통상 인용)", "detail": "주라섬의 유일한 증류소로 알려져 있다. 전반적으로 가볍고 부드러운 스타일에 이탄 제품도 일부 있다(추정).", "tags": ["주라", "가벼움"]}, {"name": "아란 (Isle of Arran)", "meta": "아란섬 로흐랜자 / 1995년 증류 시작(추정)", "detail": "아란섬 북부 로흐랜자에 있는 비교적 신생 독립 증류소다. 과일 향이 있는 부드러운 스타일로 알려져 있다(추정).", "tags": ["아란", "독립", "신생"]}], "sources": []}, "lowland": {"title": "로우랜드", "subtitle": "Lowland", "summary": "스코틀랜드 남부 지역으로, 전통적으로 가볍고 부드러우며 풀·꽃 향의 위스키로 알려져 있습니다. (외부 출처 대조 없이 작성, 연도는 추정.)", "facts": ["Auchentoshan은 삼중 증류를 하는 것으로 알려져 있습니다.", "현재 증류소 수는 하이랜드·스페이사이드보다 적습니다. (추정)"], "items": [{"name": "Auchentoshan", "meta": "1800년대 초 (추정)", "detail": "삼중 증류로 가볍고 매끈한 질감, 감귤과 바닐라.", "tags": ["삼중증류", "가벼움"]}, {"name": "Glenkinchie", "meta": "1830년대 (추정)", "detail": "에든버러 인근. 풀 내음과 가벼운 맥아 풍미.", "tags": ["풀", "가벼움"]}, {"name": "Bladnoch", "meta": "1800년대 초 (추정)", "detail": "스코틀랜드 최남단 증류소로 알려져 있음.", "tags": ["최남단", "부드러움"]}, {"name": "Ailsa Bay", "meta": "2007 (추정)", "detail": "비교적 최근에 지어진 대형 증류소로 알려져 있으며 스타일 실험이 특징.", "tags": ["신생", "실험적"]}], "sources": [], "key": "lowland"}, "campbeltown": {"title": "캠벨타운", "subtitle": "Campbeltown", "summary": "킨타이어 반도 끝의 작은 항구 도시. 19세기에는 증류소가 매우 많았으나 지금은 소수만 남아 있습니다. 짭짤하고 약간의 스모크, 오일리한 질감이 특징으로 이야기됩니다. (외부 출처 대조 없이 작성.)", "facts": ["한때 수십 곳(30곳 안팎으로 알려짐, 추정)의 증류소가 있었습니다.", "현재 활동 중인 곳은 Springbank, Glen Scotia, Glengyle 등 소수입니다."], "items": [{"name": "Springbank", "meta": "1828 (추정)", "detail": "독특한 증류 방식과 자체 몰팅으로 유명. 짭짤함, 오일리함.", "tags": ["짭짤함", "클래식"]}, {"name": "Glen Scotia", "meta": "1832 (추정)", "detail": "가벼운 해풍과 달콤함이 공존하는 스타일.", "tags": ["해풍", "달콤함"]}, {"name": "Glengyle (Kilkerran)", "meta": "2004 (추정)", "detail": "Springbank 소유로 재개된 증류소. 제품명은 Kilkerran.", "tags": ["재개", "Kilkerran"]}], "sources": [], "key": "campbeltown"}, "tasting_history": {"key": "tasting_history", "title": "위스키 테이스팅 방법과 풍미 계열, 스카치 역사", "subtitle": "Whisky Tasting, Flavour Families and History of Scotch", "summary": "싱글몰트 위스키 테이스팅은 색, 향, 맛, 피니시를 차례로 관찰하고 물 한 방울로 향을 열어 보는 과정이다. 풍미는 과일, 꽃, 몰트, 스모키, 스파이시, 우디 등 계열로 나누어 표현한다. 스카치 위스키의 최초 공식 기록은 1494년 Exchequer Rolls이며, 1823년 Excise Act가 합법 증류의 기반이 되었다.", "facts": ["1494년 스코틀랜드 Exchequer Rolls에 'aqua vitae'를 만들 맥아(몰트) 8볼(bolls)을 수사 John Cor에게 준 기록이 있으며, 스카치 위스키의 가장 이른 기록으로 알려져 있다.", "1823년 Excise Act(Distillery Act)는 증류 면허 제도를 정비해 합법 증류를 촉진했다.", "1830년 Aeneas Coffey가 연속식 증류기(Coffey still) 특허를 받았다(1831년 표기도 있어 출처에 따라 차이, 추정).", "현재 스카치 위스키는 오크통에서 최소 3년 숙성해야 한다는 규정이 있다(Scotch Whisky Regulations 2009)."], "items": [{"name": "색(Colour) 관찰", "meta": "테이스팅 1단계", "detail": "글라스를 흰 배경에 두고 색을 본다. 색은 숙성 캐스크 종류(버번, 셰리 등)의 영향을 받지만 색만으로 숙성 연수를 판단할 수는 없다. 캐러멜 색소 첨가 여부도 영향을 준다.", "tags": ["테이스팅", "외관"]}, {"name": "향(Nose)", "meta": "테이스팅 2단계", "detail": "글라스를 코에서 조금 떨어뜨려 가볍게 맡은 뒤 서서히 가까이 가져간다. 입을 살짝 벌리면 알코올 자극이 줄어든다. 처음 인상과 시간이 지나며 변하는 향을 모두 기록한다.", "tags": ["테이스팅", "향"]}, {"name": "맛(Palate)", "meta": "테이스팅 3단계", "detail": "소량을 입에 머금어 혀 전체에 굴린다. 단맛, 신맛, 쓴맛, 짠맛과 질감(바디)을 느끼고 향에서 느낀 풍미와 비교한다.", "tags": ["테이스팅", "맛"]}, {"name": "피니시(Finish)", "meta": "테이스팅 4단계", "detail": "삼킨 뒤 입과 목에 남는 여운이다. 길이(짧음~긴)와 변화하는 풍미를 평가한다.", "tags": ["테이스팅", "여운"]}, {"name": "물 한 방울", "meta": "선택 단계", "detail": "물을 몇 방울 더하면 도수가 낮아져 향이 열리고 숨은 풍미가 드러날 수 있다. 넣는 양은 취향에 따르며, 캐스크 스트렝스에서 특히 흔히 쓴다.", "tags": ["테이스팅", "가수"]}, {"name": "글라스", "meta": "도구", "detail": "입구가 좁아지는 튤립형 노징 글라스(예: 글렌캐런 글라스)는 향을 모아 주어 향 감상에 적합하다. 입구가 넓은 텀블러는 향이 쉽게 흩어진다.", "tags": ["테이스팅", "도구"]}, {"name": "과일 계열", "meta": "풍미 계열", "detail": "사과, 배, 감귤, 건과일, 열대과일 등의 느낌이다. 주로 발효와 증류 특성, 버번 캐스크 숙성에서 나타나는 경우가 많다(일반적 경향).", "tags": ["풍미", "과일"]}, {"name": "꽃 계열", "meta": "풍미 계열", "detail": "헤더, 장미, 라벤더 같은 가벼운 꽃향이다. 스페이사이드나 로우랜드 계열의 가벼운 위스키에서 자주 언급된다(일반적 경향).", "tags": ["풍미", "꽃"]}, {"name": "몰트/곡물 계열", "meta": "풍미 계열", "detail": "비스킷, 보리, 빵, 맥아 단맛 같은 풍미다. 원료인 맥아에서 오는 기본 골격을 이룬다.", "tags": ["풍미", "몰트"]}, {"name": "스모키/피티 계열", "meta": "풍미 계열", "detail": "맥아를 말릴 때 피트(이탄)를 태워 생기는 연기, 약품, 해변 같은 풍미다. 아일라 지역 위스키로 잘 알려져 있다.", "tags": ["풍미", "스모키"]}, {"name": "스파이시 계열", "meta": "풍미 계열", "detail": "후추, 계피, 생강 같은 향신료 느낌이다. 오크 숙성과 셰리 캐스크에서 자주 나타난다(일반적 경향).", "tags": ["풍미", "스파이시"]}, {"name": "우디 계열", "meta": "풍미 계열", "detail": "바닐라, 코코넛, 삼나무, 토스트 같은 오크 유래 풍미다. 캐스크 종류와 숙성 기간에 따라 강도가 달라진다.", "tags": ["풍미", "우디"]}], "sources": []}, "highland": {"key": "highland", "title": "하이랜드", "subtitle": "Highland", "summary": "하이랜드는 스코틀랜드에서 면적이 가장 넓은 위스키 생산 지역으로, 북부·남부·동부·서부로 나누어 부르기도 합니다. 지역이 넓은 만큼 스타일이 다양해 하나의 특징으로 묶기 어렵습니다. 대체로 북부는 묵직하고 풍성한 맛, 남부는 가볍고 부드러운 맛으로 알려져 있습니다(일반적 평가). 아래 증류소 정보는 출처 접속 불가로 웹 검증을 하지 못했으며 설립연도는 기억 기반 추정입니다.", "facts": ["하이랜드는 스코틀랜드 위스키 5개 법적 구역 중 하나로 면적이 가장 넓다.", "북부, 남부, 동부, 서부(섬 지역 제외)로 나누어 설명하는 경우가 많다.", "스타일이 매우 다양해 단일한 풍미로 규정하기 어렵다.", "북부 하이랜드는 풍성하고 묵직한 경향, 남부는 가볍고 부드러운 경향이 있다(일반적 평가)."], "items": [{"name": "글렌모렌지 (Glenmorangie)", "meta": "1843년(추정) / 테인(북부)", "detail": "북부 하이랜드 테인에 있는 증류소입니다. 스코틀랜드에서 키가 큰 증류기로 알려져 있으며 가볍고 과일·꽃향 중심의 스타일로 평가됩니다.", "tags": ["북부", "플로럴"]}, {"name": "달모어 (Dalmore)", "meta": "1839년(추정) / 앨니스(북부)", "detail": "북부 하이랜드 앨니스 인근의 증류소입니다. 셰리 캐스크 숙성을 활용한 묵직하고 풍성한 스타일로 알려져 있습니다.", "tags": ["북부", "셰리"]}, {"name": "올드 풀트니 (Old Pulteney)", "meta": "1826년(추정) / 윅(북부)", "detail": "본토 최북단 부근 항구 도시 윅의 증류소입니다. 바닷바람 영향을 받은 짭짤한 풍미로 알려져 있습니다.", "tags": ["북부", "해안"]}, {"name": "클라이넬리시 (Clynelish)", "meta": "1967년(현 증류소) / 브로라(북부)", "detail": "서덜랜드 브로라에 있는 증류소입니다. 왁시한 질감으로 평가되는 위스키로 알려져 있습니다.", "tags": ["북부", "왁시"]}, {"name": "달위니 (Dalwhinnie)", "meta": "1897년(추정) / 중부 하이랜드", "detail": "스코틀랜드에서 가장 높은 곳에 위치한 증류소 중 하나로 알려져 있습니다. 부드럽고 은은한 꿀 느낌의 스타일로 평가됩니다.", "tags": ["고지대", "부드러움"]}, {"name": "오반 (Oban)", "meta": "1794년(추정) / 오반(서부)", "detail": "서부 해안 항구 도시 오반에 있는 소규모 증류소입니다. 중간 정도 바디에 가벼운 스모키함과 해안 느낌이 있는 스타일로 알려져 있습니다.", "tags": ["서부", "해안"]}, {"name": "글렌고인 (Glengoyne)", "meta": "1833년(추정) / 던게이노치(남부 경계)", "detail": "하이랜드 남쪽 경계에 위치해 하이랜드와 로우랜드 경계에 있다고 설명되는 증류소입니다. 피트를 쓰지 않는 부드러운 스타일로 알려져 있습니다.", "tags": ["남부", "논피티드"]}, {"name": "글렌 게리오크 (Glen Garioch)", "meta": "1797년(추정) / 올드멜드럼(동부)", "detail": "동부 하이랜드 애버딘셔의 증류소로 스코틀랜드의 오래된 증류소 중 하나로 알려져 있습니다. 약간의 스모키함을 가진 스타일로 평가됩니다.", "tags": ["동부", "스모키"]}], "sources": []}, "glossary_law": {"key": "glossary_law", "title": "싱글몰트 용어 사전과 스카치 위스키 규정", "subtitle": "Single Malt Glossary and Scotch Whisky Regulations 2009", "summary": "싱글몰트 스카치 위스키를 이해하기 위한 핵심 용어와 법적 정의를 정리했다. 스카치 위스키는 Scotch Whisky Regulations 2009에 따라 스코틀랜드에서 증류·숙성되어야 하며, 싱글몰트는 한 증류소에서 물과 맥아 보리만으로 단식 증류기로 만든 것이다. 아래 내용은 작성자의 사전 지식에 기반하며, 이 세션에서는 네트워크 제한으로 출처 URL을 검증하지 못했다.", "facts": ["Scotch Whisky Regulations 2009는 스카치 위스키의 생산, 라벨링, 포장, 광고를 규율하는 영국 법령이다.", "스카치 위스키는 스코틀랜드의 증류소에서 증류·숙성되어야 하며, 오크통에서 최소 3년 숙성해야 한다.", "병입 시 최소 알코올 도수는 40% ABV이다.", "싱글몰트는 단일 증류소에서 물과 맥아 보리만으로 단식(포트스틸) 증류기로 증류한 위스키이다.", "오크통 용량은 700리터 이하여야 한다.", "착색용 캐러멜(E150a) 외에는 물과 캐러멜 색소 이외의 첨가물을 쓸 수 없다."], "items": [{"name": "Scotch Whisky Regulations 2009", "meta": "2009년, 영국", "detail": "스카치 위스키의 정의와 카테고리(싱글몰트, 싱글그레인, 블렌디드 등)를 규정한 법령이다. 생산, 라벨링, 광고 규칙을 포함한다.", "tags": ["규정", "법"]}, {"name": "싱글몰트 정의", "meta": "규정", "detail": "한 증류소에서 물과 맥아 보리만으로 단식 증류기에서 증류한 스카치 위스키이다. 다른 곡물을 섞을 수 없다.", "tags": ["규정", "정의"]}, {"name": "최소 3년 숙성", "meta": "규정", "detail": "스카치 위스키는 스코틀랜드 내 오크통에서 최소 3년 숙성해야 한다. 병에 표기한 연수는 가장 어린 원액 기준이다.", "tags": ["규정", "숙성"]}, {"name": "오크통 요건", "meta": "규정", "detail": "숙성에는 700리터를 넘지 않는 오크통을 써야 한다. 숙성은 스코틀랜드 내 창고에서 이뤄져야 한다.", "tags": ["규정", "오크"]}, {"name": "최소 40% ABV", "meta": "규정", "detail": "병입된 스카치 위스키는 알코올 도수가 최소 40%여야 한다.", "tags": ["규정", "도수"]}, {"name": "Angel's share", "meta": "숙성", "detail": "숙성 중 오크통에서 증발해 사라지는 위스키의 양을 가리키는 말이다. 스코틀랜드에서는 대체로 연 2% 안팎으로 알려져 있다.", "tags": ["숙성", "증발"]}, {"name": "Cask strength", "meta": "병입", "detail": "물을 타서 도수를 낮추지 않고 통에서 나온 도수 그대로 병입한 위스키이다. 보통 50~60%대이다.", "tags": ["병입", "도수"]}, {"name": "NAS (No Age Statement)", "meta": "표기", "detail": "병에 숙성 연수를 표기하지 않은 제품이다. 법적 최소 3년 이상은 지켜야 한다.", "tags": ["표기"]}, {"name": "Chill filtering", "meta": "가공", "detail": "낮은 온도로 냉각해 지방산 등을 걸러내 차갑거나 물을 탔을 때 생기는 혼탁을 막는 공정이다. 이를 생략한 것을 non-chill filtered라 한다.", "tags": ["가공"]}, {"name": "Peat", "meta": "맥아 건조", "detail": "이탄이다. 맥아를 건조할 때 태워 스모키한 향을 입히는 데 쓴다. 아일라 지역 위스키가 대표적이다.", "tags": ["피트", "향"]}, {"name": "PPM (Phenol Parts Per Million)", "meta": "측정", "detail": "맥아의 페놀 함량을 나타내는 단위로 피트 강도의 지표이다. 증류 후 실제 풍미와는 일치하지 않을 수 있다.", "tags": ["피트", "측정"]}, {"name": "Finish", "meta": "숙성", "detail": "주 숙성 후 다른 종류의 통에 옮겨 짧게 추가 숙성하는 과정이다. 포트, 와인, 셰리 통 등이 쓰인다.", "tags": ["숙성", "오크"]}, {"name": "Sherry cask", "meta": "오크", "detail": "셰리를 담았던 통이다. 건과일, 견과류, 향신료 풍미를 더하는 것으로 알려져 있다.", "tags": ["오크", "셰리"]}, {"name": "Bourbon cask", "meta": "오크", "detail": "버번 숙성에 쓴 미국산 오크통으로 스카치 숙성에 가장 많이 쓰인다. 바닐라와 코코넛 풍미를 준다.", "tags": ["오크", "버번"]}, {"name": "Malt (맥아)", "meta": "원료", "detail": "보리를 물에 불려 발아시킨 뒤 건조한 것이다. 싱글몰트의 유일한 곡물 원료이다.", "tags": ["원료"]}, {"name": "Mashing (매싱)", "meta": "공정", "detail": "분쇄한 맥아를 뜨거운 물과 섞어 당분을 추출하는 공정이다. 결과물을 워트(wort)라 한다.", "tags": ["공정"]}, {"name": "Wash", "meta": "공정", "detail": "워트를 효모로 발효시킨 알코올 도수 약 8% 안팎의 액체이다. 첫 증류의 대상이다.", "tags": ["공정", "발효"]}, {"name": "Pot still", "meta": "증류", "detail": "구리로 만든 단식 증류기이다. 싱글몰트는 반드시 이 방식으로 증류한다.", "tags": ["증류"]}, {"name": "New make spirit", "meta": "증류", "detail": "증류 직후 숙성 전의 무색 원액이다. 3년 이상 숙성해야 위스키라 부를 수 있다.", "tags": ["증류"]}, {"name": "Cut (컷)", "meta": "증류", "detail": "2차 증류에서 초류(foreshots)와 후류(feints)를 버리고 중류(heart)만 취하는 것이다.", "tags": ["증류"]}, {"name": "Single cask", "meta": "병입", "detail": "한 개의 통에서만 병입한 위스키이다. 통마다 개성이 크다.", "tags": ["병입"]}, {"name": "Vatting (배팅)", "meta": "블렌딩", "detail": "여러 통의 몰트를 섞는 것이다. 한 증류소 원액만 섞으면 싱글몰트로 남는다.", "tags": ["블렌딩"]}, {"name": "Blended malt", "meta": "카테고리", "detail": "여러 증류소의 싱글몰트를 섞은 위스키로 예전에는 vatted malt라 불렀다. 곡물 위스키는 들어가지 않는다.", "tags": ["카테고리"]}, {"name": "Age statement", "meta": "표기", "detail": "병에 표기된 숙성 연수이다. 혼합 시 가장 어린 원액의 나이를 표기해야 한다.", "tags": ["표기", "숙성"]}, {"name": "Refill cask", "meta": "오크", "detail": "이미 위스키를 한 번 이상 숙성한 통이다. 풍미 부여가 약하고 원액의 성격이 더 드러난다.", "tags": ["오크"]}, {"name": "Quaich", "meta": "문화", "detail": "스코틀랜드 전통의 양손잡이 얕은 잔이다. 환영의 의미로 위스키를 나눌 때 쓴다.", "tags": ["문화"]}], "sources": []}, "production": {"key": "production", "title": "싱글몰트 제조 공정", "subtitle": "Single Malt Scotch Whisky Production", "summary": "싱글몰트 스카치 위스키는 한 곳의 증류소에서 맥아 보리(몰티드 배리), 물, 효모만으로 만들어 단식 증류기(포트 스틸)로 증류한 위스키다. 공정은 몰팅, 피팅(건조), 매싱, 발효, 증류, 숙성, 병입 순으로 진행된다. 스코틀랜드 법규상 오크통에서 최소 3년 숙성해야 하며 병입 도수는 최소 40%이다.", "facts": ["싱글몰트는 한 증류소에서 맥아 보리만을 원료로 단식 증류기로 증류한 위스키이다.", "스카치 위스키는 스코틀랜드 내 오크통에서 최소 3년 숙성해야 한다.", "병입 시 알코올 도수는 최소 40% ABV이어야 한다.", "발효에는 보통 약 48~96시간이 걸린다(추정).", "대부분의 증류소는 단식 증류기로 2회 증류한다(일부는 다른 횟수)."], "items": [{"name": "몰팅 (Malting)", "meta": "1단계", "detail": "보리를 물에 불려 발아시켜 전분을 당으로 바꿀 효소를 활성화한다. 발아가 적당히 진행되면 건조해 발아를 멈춘다. 전통적으로 바닥 몰팅이 쓰였으나 현재는 대부분 상업 몰팅 시설에서 공급받는다.", "tags": ["보리", "발아"]}, {"name": "피팅/건조 (Peating & Kilning)", "meta": "2단계", "detail": "발아한 보리를 가마(킬른)에서 열풍으로 건조한다. 이탄(피트)을 태운 연기를 쓰면 스모키한 풍미가 더해지며 피트 사용량이 위스키 개성에 영향을 준다.", "tags": ["피트", "건조"]}, {"name": "매싱 (Mashing)", "meta": "3단계", "detail": "건조한 맥아를 분쇄(그리스트)해 뜨거운 물과 섞어 당분이 많은 맥아즙(워트)을 추출한다. 보통 여러 차례 물을 나눠 넣어 당을 추출한다. 남은 곡물 찌꺼기는 가축 사료 등으로 쓰인다(추정).", "tags": ["당화", "워트"]}, {"name": "발효 (Fermentation)", "meta": "4단계", "detail": "워트를 발효조(워시백)에 옮기고 효모를 넣어 당을 알코올로 바꾼다. 결과물인 워시는 대략 알코올 7~8% 수준이다(추정). 발효 시간과 효모는 풍미에 영향을 준다.", "tags": ["효모", "워시"]}, {"name": "증류 (Distillation)", "meta": "5단계 · 단식 증류기", "detail": "구리 단식 증류기에서 보통 2회 증류한다. 초류와 후류를 잘라내고 중간 부분(미들 컷)만 취한다. 증류기의 모양과 크기가 술의 성격에 영향을 준다.", "tags": ["포트 스틸", "구리"]}, {"name": "숙성 (Maturation)", "meta": "6단계", "detail": "증류액을 오크통에 담아 스코틀랜드에서 최소 3년 숙성한다. 버번 배럴이나 셰리 캐스크 등이 흔히 쓰인다. 통과 환경이 색과 향을 만든다.", "tags": ["오크", "3년 이상"]}, {"name": "병입 (Bottling)", "meta": "7단계", "detail": "숙성된 원액을 필요 시 섞고 물로 도수를 조정해 병에 담는다. 최소 도수는 40%이다. 캐스크 스트렝스나 논칠필터링 등 방식은 제품마다 다르다.", "tags": ["도수 40%", "병입"]}], "sources": []}};

  nav.append(search)}
function match(it){return !q||[it.name,it.meta,it.detail,...(it.tags||[])].join(' ').toLowerCase().includes(q)}
function inTab(k){if(tab==='all')return true;if(tab==='regions')return REGIONS.includes(k);return tab===k||(tab==='tasting_history'&&k==='tasting_history')}
function render(){main.replaceChildren();let n=0;
  ORDER.forEach(k=>{const d=DATA[k];if(!d||!inTab(k))return;
    const items=(d.items||[]).filter(match);
    if(q&&!items.length)return;n++;
    const s=$('section','sec glass');s.id=k;
    s.append($('div','sub',d.subtitle||''),$('h2','',d.title),$('p','',d.summary||''));
    if(!q&&d.facts&&d.facts.length){const u=$('ul','facts');d.facts.forEach(f=>u.append($('li','',f)));s.append(u)}
    const g=$('div','grid');
    items.forEach(it=>{const c=$('div','card');c.append($('h3','',it.name));
      if(it.meta)c.append($('div','meta',it.meta));
      c.append($('p','',it.detail||''));
      (it.tags||[]).forEach((t,i)=>c.append($('span','tag t'+(i%3),t)));g.append(c)});
    s.append(g);
    if(!(d.sources||[]).length){s.append($('div','src','출처: 이 환경의 네트워크 제한으로 링크를 검증하지 못해 출처를 싣지 않았습니다. 내용은 확인된 일반 지식 기반이며 불확실한 부분은 “(추정)”으로 표시했습니다.'))}
    if((d.sources||[]).length){const sr=$('div','src','출처: ');
      d.sources.forEach((x,i)=>{if(i)sr.append(' · ');const a=$('a','',x.title);a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';sr.append(a)});s.append(sr)}
    main.append(s)});
  if(!n)main.append($('div','empty glass','검색 결과가 없습니다.'))}
drawNav();render();
</script>
</body>
</html>
